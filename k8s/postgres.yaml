apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: stockvaluator
    component: database
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: stockvaluator
      component: database
  template:
    metadata:
      labels:
        app: stockvaluator
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: stockvaluator
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: stockvaluator
    component: database
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: stockvaluator
    component: database
