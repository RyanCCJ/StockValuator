apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockvaluator-backend
  labels:
    app: stockvaluator
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockvaluator
      component: backend
  template:
    metadata:
      labels:
        app: stockvaluator
        component: backend
    spec:
      containers:
        - name: backend
          image: stockvaluator-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8500
          env:
            # --- Network Config from ConfigMap ---
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: BACKEND_PORT
            
            # --- Sensitive Secrets ---
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: SECRET_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_SECRET
            
            # --- Gmail Config ---
            - name: GMAIL_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GMAIL_USER_EMAIL
            - name: GMAIL_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GMAIL_REFRESH_TOKEN
            
            # --- Public/URL Config from ConfigMap ---
            - name: GMAIL_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: GMAIL_REDIRECT_URI
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: CORS_ORIGINS
            
            # --- AI Scoring Config from ConfigMap ---
            - name: AI_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: AI_PROVIDER
            - name: AI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: AI_MODEL
            
            # --- AI Scoring API Keys from Secrets ---
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: ANTHROPIC_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GEMINI_API_KEY

          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8500
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8500
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockvaluator-frontend
  labels:
    app: stockvaluator
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockvaluator
      component: frontend
  template:
    metadata:
      labels:
        app: stockvaluator
        component: frontend
    spec:
      containers:
        - name: frontend
          image: stockvaluator-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3500
          env:
            # --- Network Config from ConfigMap ---
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: FRONTEND_PORT
            
            # --- URL Config from ConfigMap ---
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: BACKEND_URL
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: NEXTAUTH_URL
            - name: AUTH_TRUST_HOST
              valueFrom:
                configMapKeyRef:
                  name: stockvaluator-config
                  key: AUTH_TRUST_HOST
            
            # --- Sensitive Secrets ---
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: AUTH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: NEXT_PUBLIC_BRANDFETCH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: NEXT_PUBLIC_BRANDFETCH_CLIENT_ID
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 3500
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockvaluator-celery-worker
  labels:
    app: stockvaluator
    component: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockvaluator
      component: celery-worker
  template:
    metadata:
      labels:
        app: stockvaluator
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: stockvaluator-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "celery", "-A", "src.worker:celery_app", "worker", "--loglevel=info"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: REDIS_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: SECRET_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GMAIL_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GMAIL_USER_EMAIL
            - name: GMAIL_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: stockvaluator-secrets
                  key: GMAIL_REFRESH_TOKEN
            - name: GMAIL_REDIRECT_URI
              value: "http://localhost:8500/email/oauth/callback"
          resources:
            requests:
              memory: "1Gi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
---
