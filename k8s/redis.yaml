apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: stockvaluator
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stockvaluator
      component: cache
  template:
    metadata:
      labels:
        app: stockvaluator
        component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: stockvaluator
    component: cache
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: stockvaluator
    component: cache
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
