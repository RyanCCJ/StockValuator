apiVersion: v1
kind: Secret
metadata:
  name: stockvaluator-secrets
type: Opaque
stringData:
  # ==========================================
  # BACKEND VARIABLES (from backend/.env.example)
  # ==========================================
  
  # Database & Redis (Pre-configured for K8s internal network)
  DATABASE_URL: "postgresql+asyncpg://postgres:password@postgres:5432/stockvaluator"
  REDIS_URL: "redis://redis:6379/0"

  # Security
  SECRET_KEY: "change-me-to-a-secure-random-string-for-backend"
  
  # Gmail Integration (Optional)
  GMAIL_USER_EMAIL: ""
  GMAIL_REFRESH_TOKEN: ""

  # ==========================================
  # FRONTEND VARIABLES (from frontend/.env.example)
  # ==========================================

  # NextAuth Security
  AUTH_SECRET: "change-me-to-a-secure-random-string-for-frontend"
  
  # Brandfetch (Client Side)
  NEXT_PUBLIC_BRANDFETCH_CLIENT_ID: ""

  # ==========================================
  # SHARED VARIABLES
  # ==========================================
  
  # Google OAuth
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""